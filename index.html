<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Northstar Loans</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      color: #243b53;
    }
    main {
      max-width: 520px;
      width: 100%;
      padding: 36px 28px;
      text-align: center;
      background: white;
      border-radius: 18px;
      box-shadow: 0 12px 35px rgba(16,42,67,.10);
    }
    .symbol {
      width: 68px;
      height: 68px;
      margin: 0 auto 20px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #e8eef5;
      color: #102a43;
      font-size: 32px;
    }
    h1 { color: #102a43; }
    p { line-height: 1.7; }
    .small { color: #627d98; font-size: 13px; margin-top: 22px; }
  </style>
</head>
<body>
  <main>
    <div class="symbol">✦</div>
    <h1>Northstar Loans</h1>
    <h2>Service Temporarily Unavailable</h2>
    <p>We're unable to accept applications at this time. Please check back later.</p>
    <p class="small">Thank you for your understanding.</p>
  </main>
</body>
</html>
