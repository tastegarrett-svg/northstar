
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Northstar Loans</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #17243a;
    }
    header {
      background: #102b50;
      color: white;
      padding: 24px;
      text-align: center;
    }
    main {
      max-width: 600px;
      margin: 45px auto;
      padding: 24px;
      text-align: center;
    }
    .panel {
      background: white;
      padding: 28px;
      border-radius: 14px;
      box-shadow: 0 4px 18px #00000012;
    }
    button {
      background: #1769e0;
      color: white;
      border: 0;
      border-radius: 8px;
      padding: 14px 24px;
      font-size: 16px;
      cursor: pointer;
    }
    .notice {
      font-size: 13px;
      color: #5b6575;
      margin-top: 24px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Northstar Loans</h1>
    <p>Your loan journey starts here</p>
  </header>

  <main>
    <div class="panel">
      <h2>Welcome to Northstar</h2>
      <p>Explore loan options, submit applications,
      and track your application status.</p>
      <button onclick="alert('Loan application features will be added next.')">
        Explore Loan Options
      </button>
      <p class="notice">
        Loan eligibility, terms, fees, and approval
        are subject to verification.
      </p>
    </div>
  </main>
</body>
  </html>
